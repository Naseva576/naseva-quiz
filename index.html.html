<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ナセバ学習ナビ</title>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; margin: 0; color: #333; }
        header { background-color: #1e3a8a; color: white; padding: 1.5rem; text-align: center;}
        main { max-width: 600px; margin: 2rem auto; padding: 1rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .setting-group { margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        select { padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; width: 60%; font-size: 1rem; }
        .start-btn { display: block; width: 100%; padding: 1rem; margin-top: 2rem; background-color: #3b82f6; color: white; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .start-btn:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <header>
        <h1>ナセバ学習ナビ</h1>
    </header>
    <main>
        <h2>漢字・語彙 小テスト 設定</h2>
        <div class="setting-group">
            <label>開始単元：</label>
            <select id="start-range">
                <!-- 1〜16章まで生成 -->
                <script>
                    for(let i=1; i<=16; i++) document.write(`<option value="${i}">最頻出 ${i}</option>`);
                </script>
            </select>
        </div>
        <div class="setting-group">
            <label>終了単元：</label>
            <select id="end-range">
                <script>
                    for(let i=1; i<=15; i++) document.write(`<option value="${i}">最頻出 ${i}</option>`);
                    document.write(`<option value="16" selected>最頻出 16</option>`);
                </script>
            </select>
        </div>
        <div class="setting-group">
            <label>出題数：</label>
            <select id="question-count">
                <option value="10">10問</option>
                <option value="25">25問</option>
                <option value="50" selected>50問</option>
                <option value="100">100問</option>
            </select>
        </div>
        <button class="start-btn" onclick="startQuiz()">テストを開始する</button>
    </main>

    <script>
        function startQuiz() {
            const start = parseInt(document.getElementById("start-range").value);
            const end = parseInt(document.getElementById("end-range").value);
            const count = document.getElementById("question-count").value;
            
            const min = Math.min(start, end);
            const max = Math.max(start, end);

            window.location.href = `quiz.html?start=${min}&end=${max}&count=${count}`;
        }
    </script>
</body>
</html>
