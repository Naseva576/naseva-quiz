<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字小テスト実行中</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; color: #333; }
        header { background-color: #1e3a8a; color: white; padding: 1rem; display: flex; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; border: 1px solid white; padding: 0.3rem 0.8rem; border-radius: 4px; }
        main { max-width: 800px; margin: 2rem auto; padding: 1rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .question-text { font-size: 1.3rem; font-weight: bold; margin-bottom: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 1rem; }
        .choice-btn { display: block; width: 100%; text-align: left; padding: 1rem; margin-bottom: 0.8rem; background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
        .choice-btn:hover { background: #eff6ff; border-color: #3b82f6; }
        .choice-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .choice-btn.wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        #feedback { font-size: 1.2rem; font-weight: bold; text-align: center; margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
        .next-btn { display: none; width: 100%; padding: 1rem; margin-top: 1rem; background: #3b82f6; color: white; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; }
        #error-log { color: #dc2626; font-size: 0.9rem; background: #fef2f2; padding: 1rem; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <header>
        <h1 style="margin:0; font-size:1.2rem;">漢字小テスト</h1>
        <a href="index.html" class="back-btn">やめる</a>
    </header>

    <main>
        <div id="status">スプレッドシートから問題データを読み込み中...</div>
        <div id="error-log"></div>

        <div id="quiz-area" style="display:none;">
            <div style="color:#666; margin-bottom:1rem;" id="progress">第 1 問</div>
            <div id="question" class="question-text"></div>
            <div id="choices"></div>
            <div id="feedback"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>

        <div id="result-area" style="display:none; text-align:center;">
            <h2>テスト終了！</h2>
            <h1 id="score" style="color:#1e3a8a;"></h1>
            <button class="next-btn" style="display:block;" onclick="location.href='index.html'">ダッシュボードへ戻る</button>
        </div>
    </main>

    <script>
        const SHEET_ID = '1nNEaLe2D2fVwDB_OvIAIlD_QfWZzpKDx5IYvjm9mEm0';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        const params = new URLSearchParams(window.location.search);
        const reqStart = parseInt(params.get('start')) || 1;
        const reqEnd = parseInt(params.get('end')) || 16;
        const reqCount = parseInt(params.get('count')) || 10;

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        async function init() {
            try {
                // ファイルプロトコル（ローカル）での実行警告
                if (window.location.protocol === 'file:') {
                    showError("パソコンのファイルを直接開いているため、ブラウザのセキュリティ制限でスプレッドシートを読み込めません。GitHub Pages等にアップロードしてから確認してください。");
                    return;
                }

                const res = await fetch(CSV_URL + '&t=' + Date.now());
                if (!res.ok) throw new Error("通信エラー: " + res.status);
                
                const text = await res.text();
                parseCSV(text);
            } catch (err) {
                showError("スプレッドシートの取得に失敗しました。<br>1. スプレッドシートが「ウェブに公開」されているか確認してください。<br>エラー内容: " + err.message);
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            const filtered = [];

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < 9) continue;

                const match = cols[8].match(/\d+/);
                const chapter = match ? parseInt(match[0]) : 0;

                if (chapter >= reqStart && chapter <= reqEnd) {
                    filtered.push({
                        q: cols[1].replace(/"/g, ''),
                        c: [ cols[2].replace(/"/g, ''), cols[3].replace(/"/g, ''), cols[4].replace(/"/g, ''), cols[5].replace(/"/g, ''), cols[6].replace(/"/g, '') ],
                        a: parseInt(cols[7]) - 1
                    });
                }
            }

            if (filtered.length === 0) {
                showError(`指定された範囲（${reqStart}章〜${reqEnd}章）にデータがありません。`);
                return;
            }

            // シャッフル
            for (let i = filtered.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
            }

            questions = filtered.slice(0, Math.min(reqCount, filtered.length));
            
            document.getElementById('status').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('choices').innerHTML = '';

            const q = questions[currentIndex];
            document.getElementById('progress').textContent = `第 ${currentIndex + 1} 問 / 全 ${questions.length} 問`;
            document.getElementById('question').textContent = q.q;

            q.c.forEach((choiceText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choiceText;
                btn.onclick = () => selectAnswer(idx, btn);
                document.getElementById('choices').appendChild(btn);
            });
        }

        function selectAnswer(idx, btn) {
            if (answered) return;
            answered = true;

            const correctIdx = questions[currentIndex].a;
            const buttons = document.getElementById('choices').children;

            if (buttons[correctIdx]) buttons[correctIdx].classList.add('correct');

            const fb = document.getElementById('feedback');
            if (idx === correctIdx) {
                score++;
                fb.textContent = "⭕️ 正解！";
                fb.style.backgroundColor = "#d1fae5"; fb.style.color = "#065f46";
            } else {
                btn.classList.add('wrong');
                fb.textContent = "❌ 不正解...";
                fb.style.backgroundColor = "#fee2e2"; fb.style.color = "#991b1b";
            }
            
            fb.style.display = 'block';
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'block';
            if (currentIndex === questions.length - 1) nextBtn.textContent = "結果を見る";
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                showQuestion();
            } else {
                document.getElementById('quiz-area').style.display = 'none';
                document.getElementById('result-area').style.display = 'block';
                document.getElementById('score').textContent = `正答数: ${score} / ${questions.length} 問`;
            }
        }

        function showError(msg) {
            document.getElementById('status').style.display = 'none';
            const err = document.getElementById('error-log');
            err.innerHTML = msg;
            err.style.display = 'block';
        }

        init();
    </script>
</body>
</html>
